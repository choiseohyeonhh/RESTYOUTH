# XcodeGen 설정 파일
# 이 파일을 고친 뒤에는 터미널에서 `xcodegen generate`를 다시 실행하세요.
# (RestYouth.xcodeproj는 이 파일로부터 생성되므로 git에 올리지 않습니다.)

name: RestYouth

options:
  bundleIdPrefix: com.restyouth
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 실제 iPhone에 설치할 때 Apple 팀 ID를 넣습니다. 시뮬레이터는 비워 둬도 됩니다.
    DEVELOPMENT_TEAM: ""

packages:
  RestCore:
    path: Packages/RestCore

targets:
  RestYouth:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RestCore
    settings:
      base:
        # 실제 기기·출시 전에 본인만의 고유한 값으로 바꿔야 합니다.
        PRODUCT_BUNDLE_IDENTIFIER: com.restyouth.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 쉬었음
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      gatherCoverageData: false
